name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.2"
      
      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --maxfail=1 --disable-warnings -q

  lint:  # ruff 静的解析ジョブを定義
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.2"

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check .
  
  type_check:  # mypy 型チェックジョブを定義
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.2"

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy src
        
      